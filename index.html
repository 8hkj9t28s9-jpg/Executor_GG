<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Executor</title>
  <style>
    /* Super Black & Smooth Rendering */
    html, body {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      background-color: #000000; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      overflow: hidden; touch-action: none;
    }
    
    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
    }

    /* Canvas Layer (Bottom) */
    #render-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
      pointer-events: auto;
    }

    /* Joystick Layer */
    #joystick-container {
      position: absolute; bottom: 30px; left: 30px;
      width: 120px; height: 120px; z-index: 20;
      opacity: 0.5; transition: opacity 0.2s; touch-action: none;
    }
    #joystick-base {
      width: 100%; height: 100%; border: 2px solid rgba(255,255,255,0.4);
      border-radius: 50%; position: relative;
    }
    #joystick-stick {
      width: 40%; height: 40%; background: #ffffff; border-radius: 50%; position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none;
    }

    /* Tiny Floating Button (Always Clickable) */
    #menu-toggle {
      position: absolute; top: 20px; left: 20px;
      width: 48px; height: 48px;
      background: rgba(30, 30, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px; z-index: 99999;
      display: flex; justify-content: center; align-items: center;
      font-size: 22px; cursor: pointer; backdrop-filter: blur(10px);
      pointer-events: auto; touch-action: manipulation;
    }
    #menu-toggle:active {
      background: rgba(80, 80, 80, 0.9);
      transform: scale(0.92);
    }

    /* Expanded Main Window */
    #main-window {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      width: 92vw; max-width: 440px;
      height: 85vh; max-height: 600px;
      background: rgba(12, 12, 12, 0.96);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px; z-index: 100000;
      display: flex; flex-direction: column;
      opacity: 0; pointer-events: none; transition: all 0.2s ease-out;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    }
    #main-window.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1; pointer-events: auto;
    }

    /* Window Header */
    .window-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .window-title { font-size: 17px; font-weight: 600; letter-spacing: 0.5px; }
    .close-btn { 
      background: none; border: none; color: #fff; font-size: 26px; 
      cursor: pointer; padding: 4px 10px; line-height: 1;
    }

    /* Window Content Layout */
    .window-content {
      flex: 1; display: flex; flex-direction: column;
      padding: 16px; gap: 14px; overflow-y: auto;
    }
    
    /* Clean Settings Rows */
    .setting-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #ccc; }
    .setting-row select, .setting-row input[type="range"] {
      background: #222; color: #fff; border: 1px solid #444; padding: 6px 10px; border-radius: 6px; outline: none;
    }
    .setting-row input[type="range"] { width: 120px; }

    /* Action Buttons */
    .action-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .btn {
      background: #222; border: 1px solid #444; color: #fff; padding: 10px;
      border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center;
      touch-action: manipulation;
    }
    .btn:active { background: #333; transform: scale(0.96); }
    .btn.run { background: #1a472a; border-color: #2e8b57; }
    .btn.clear { background: #4a1c1c; border-color: #8b0000; }

    /* Code Editor */
    #code-editor {
      flex: 1; min-height: 140px; background: #080808; color: #00ffcc;
      border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
      padding: 12px; font-family: monospace; font-size: 13px; resize: none; outline: none;
      touch-action: auto;
    }

    #telemetry { font-family: monospace; color: #888; font-size: 12px; text-align: center; }
  </style>
</head>
<body>

  <!-- Fullscreen 4K Context -->
  <canvas id="render-canvas"></canvas>

  <!-- Touch Joystick -->
  <div id="joystick-container">
    <div id="joystick-base"><div id="joystick-stick"></div></div>
  </div>

  <!-- Menu Trigger Button -->
  <div id="menu-toggle" role="button" aria-label="Open Settings">⚙</div>

  <!-- Central Modal Window -->
  <div id="main-window">
    <div class="window-header">
      <div class="window-title">Executor Control</div>
      <button class="close-btn" id="btn-close" aria-label="Close Settings">×</button>
    </div>
    
    <div class="window-content">
      <div id="telemetry">0 FPS</div>

      <div class="setting-row">
        <span>Engine</span>
        <select id="engine-select">
          <option value="none">Raw Canvas</option>
          <option value="pixi">PixiJS</option>
          <option value="three">Three.js</option>
        </select>
      </div>

      <div class="setting-row">
        <span>Joystick Opacity</span>
        <input type="range" id="joy-opacity" min="0" max="1" step="0.1" value="0.5">
      </div>

      <div class="action-grid">
        <button class="btn run" id="btn-run">Run</button>
        <button class="btn" id="btn-stop">Stop</button>
        <button class="btn clear" id="btn-clear">Clear</button>
      </div>

      <textarea id="code-editor" spellcheck="false" placeholder="// Paste custom scripts here..."></textarea>
    </div>
  </div>

  <script>
    // 1. Scaled Display Context
    const canvas = document.getElementById('render-canvas');
    const ctx = canvas.getContext('2d');
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    // 2. Reliable Tap/Click Handlers
    const menuToggle = document.getElementById('menu-toggle');
    const mainWindow = document.getElementById('main-window');
    const btnClose = document.getElementById('btn-close');

    function openWindow(e) {
      if (e) e.preventDefault();
      mainWindow.classList.add('active');
    }

    function closeWindow(e) {
      if (e) e.preventDefault();
      mainWindow.classList.remove('active');
    }

    // Bind both pointerdown (touch/stylus) and click for guaranteed responsiveness
    menuToggle.addEventListener('pointerdown', openWindow);
    btnClose.addEventListener('pointerdown', closeWindow);

    // 3. Telemetry FPS Loop
    let lastTime = performance.now();
    let frames = 0;
    const fpsDisplay = document.getElementById('telemetry');
    function loop() {
      const now = performance.now();
      frames++;
      if (now - lastTime >= 1000) {
        fpsDisplay.innerText = `${frames} FPS | Direct Touch Active`;
        frames = 0; 
        lastTime = now;
      }
      requestAnimationFrame(loop);
    }
    loop();

    // 4. Mobile Joystick Logic
    window.Input = { joystick: { x: 0, y: 0, isActive: false } };
    const joyContainer = document.getElementById('joystick-container');
    const joyStick = document.getElementById('joystick-stick');
    let jCenter = { x: 0, y: 0 }, jRadius = 0;

    joyContainer.addEventListener('pointerdown', (e) => {
      window.Input.joystick.isActive = true;
      const rect = joyContainer.getBoundingClientRect();
      jCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      jRadius = rect.width / 2;
      joyContainer.setPointerCapture(e.pointerId);
      moveStick(e);
    });

    joyContainer.addEventListener('pointermove', (e) => {
      if (window.Input.joystick.isActive) moveStick(e);
    });

    function releaseStick(e) {
      window.Input.joystick.isActive = false;
      joyStick.style.transform = `translate(-50%, -50%)`;
      try { joyContainer.releasePointerCapture(e.pointerId); } catch(err) {}
    }

    joyContainer.addEventListener('pointerup', releaseStick);
    joyContainer.addEventListener('pointercancel', releaseStick);

    function moveStick(e) {
      const dx = e.clientX - jCenter.x;
      const dy = e.clientY - jCenter.y;
      const dist = Math.min(Math.sqrt(dx * dx + dy * dy), jRadius);
      const angle = Math.atan2(dy, dx);
      const sx = Math.cos(angle) * dist;
      const sy = Math.sin(angle) * dist;
      joyStick.style.transform = `translate(calc(-50% + ${sx}px), calc(-50% + ${sy}px))`;
      window.Input.joystick.x = sx / jRadius;
      window.Input.joystick.y = sy / jRadius;
    }

    // 5. Settings & Execution
    document.getElementById('joy-opacity').addEventListener('input', (e) => {
      joyContainer.style.opacity = e.target.value;
    });

    const editor = document.getElementById('code-editor');
    document.getElementById('btn-run').onclick = () => {
      try {
        mainWindow.classList.remove('active');
        new Function('canvas', 'ctx', 'Input', `"use strict";\n${editor.value}`)(canvas, ctx, window.Input);
      } catch (err) { 
        alert("Script error: " + err.message); 
      }
    };

    document.getElementById('btn-clear').onclick = () => {
      editor.value = ''; 
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    };
  </script>
</body>
</html>
